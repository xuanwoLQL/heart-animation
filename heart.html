<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>爱心</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{width:auto;height:auto;max-width:100vw;max-height:100vh;aspect-ratio:640/480}
  #msg{color:#ff9db1;font:14px "Microsoft YaHei",sans-serif;margin-top:10px;letter-spacing:2px}
  #msg b{color:#fff}
</style>
</head>
<body>
<canvas id="cv" width="640" height="480"></canvas>
<div id="msg"><b></b></div>
<script>
'use strict';
const W=640,H=480,CW=W/2,CH=H/2;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');

// 原版 5 色：轮廓 / 边缘扩散 / 内部 / 原生光晕 / 全局光晕
const COLORS=['#FFBFF0','#FA3968','#EE41FF','#FF75AD','#FABCD4'];
const RGB=COLORS.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]);

const rand=(a,b)=>a+Math.random()*(b-a);
const randint=(a,b)=>Math.floor(rand(a,b+1));

// 心形参数方程（与原版一致）
const heartX=t=>16*Math.pow(Math.sin(t),3);
const heartY=t=>-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
const heartFunc=(t,enlarge=10)=>[heartX(t)*enlarge+CW,heartY(t)*enlarge+CH];

// 向心收缩扩散
function shrink(px,py,lamda,bidirectional=false){
  const cx=CW,cy=CH;
  let rx=-lamda*Math.log(Math.random());
  let ry=-lamda*Math.log(Math.random());
  if(bidirectional&&Math.random()>0.5){
    return [Math.max(Math.round(px+rx*(px-cx)),cx*2),Math.max(Math.round(py+ry*(py-cy)),cy*2)];
  }
  rx=Math.min(rx,1);ry=Math.min(ry,1);
  return [Math.round(px-rx*(px-cx)),Math.round(py-ry*(py-cy))];
}

// 心跳位移：ratio 为收缩系数（正缩内，负炸开），out 为向外迸射
function dance(ratio,pt,amplitude,out=false){
  const px=pt[0],py=pt[1],cx=CW,cy=CH;
  if(px===cx&&py===cy)return pt;
  const force=1/Math.sqrt((px-cx)**2+(py-cy)**2);
  if(!out){
    const dx=force*ratio*amplitude*(px-cx)+randint(-1,1);
    const dy=force*ratio*amplitude*(py-cy)+randint(-1,1);
    return [Math.max(Math.min(px-dx,cx*2),0),Math.max(Math.min(py-dy,cy*2),0)];
  }
  const dx=force*ratio*amplitude*(px-cx)*3/Math.log(Math.abs(py-cy)+Math.E)+randint(-1,1);
  const dy=force*ratio*amplitude*(py-cy)*3/Math.log(Math.abs(px-cx)+Math.E)+randint(-1,1);
  return [Math.max(Math.min(px+dx,cx*2),0),Math.max(Math.min(py+dy,cy*2),0)];
}

const NUM=1000;
const ptList=[],extraPt=[],inside=[],bgHalo=[];
const seen=new Set(),seenE=new Set(),seenI=new Set(),seenH=new Set();

// 心形线轮廓点 + 边缘/内部扩散点 + 背景光晕（一次性生成）
while(ptList.length<NUM){
  const p=heartFunc(rand(0,2*Math.PI)).map(Math.round);
  const k=p.join(',');
  if(!seen.has(k)){seen.add(k);ptList.push(p);}
}
for(const p of ptList){
  const e=shrink(p[0],p[1],0.025),i=shrink(p[0],p[1],0.15);
  const ke=e.join(','),ki=i.join(',');
  if(!seenE.has(ke)){seenE.add(ke);extraPt.push(e);}
  if(!seenI.has(ki)){seenI.add(ki);inside.push(i);}
}
while(bgHalo.length<NUM*3){
  const p=heartFunc(rand(0,2*Math.PI),rand(0.75,1.25)*10).map(Math.round);
  const k=p.join(',');
  if(!seenH.has(k)){seenH.add(k);bgHalo.push(p);}
}

// 预生成 15 帧（原版 get_frames），每帧是 [x,y,size,color] 列表
function genFrames(period=15,amplitude=5){
  const frames=[];
  const ratioT=t=>Math.sin(Math.PI*2/period*t);
  for(let t=0;t<period;t++){
    const ratio=ratioT(t);
    const pts=[];
    for(const p of ptList)pts.push([...dance(ratio,p,amplitude),randint(2,4),0]);
    for(const p of extraPt)pts.push([...dance(ratio,p,amplitude),randint(1,2),1]);
    for(const p of inside)pts.push([...dance(ratio,p,amplitude),randint(1,2),2]);
    for(const p of bgHalo)pts.push([...dance(ratio,p,amplitude),randint(1,2),3]);
    // 全局光晕：顶部 300 点 + 向心扩散光晕点（随心跳数量变化）
    const topPts=new Set();
    while(topPts.size<300){
      const p=heartFunc(rand(-Math.PI/6,Math.PI/6),10);
      topPts.add(Math.round(p[0])+','+Math.round(p[1]-randint(15,35)*Math.pow(p[1]/180,3)));
    }
    for(const k of topPts){
      const p=k.split(',').map(Number);
      pts.push([...dance(ratio*ratio,p,amplitude,true),1,4]);
    }
    const numGlobal=Math.round(bgHalo.length*(ratio*ratio+1));
    const gSet=new Set();
    while(gSet.size<numGlobal){
      const p=bgHalo[randint(0,bgHalo.length-1)];
      gSet.add(shrink(p[0],p[1],rand(0.12,0.16),true).join(','));
    }
    for(const k of gSet){
      const p=k.split(',').map(Number);
      pts.push([...dance(ratio*ratio,p,amplitude,true),1,4]);
    }
    frames.push(pts);
  }
  return frames;
}

const frames=genFrames();
let fi=0;

function drawFrame(pts){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  const buckets=new Map();
  for(const [x,y,s,c] of pts){
    const k=c+':'+s;
    if(!buckets.has(k))buckets.set(k,[]);
    buckets.get(k).push([x,y,s]);
  }
  for(const [k,arr] of buckets){
    const [c,s]=k.split(':');
    ctx.fillStyle=COLORS[c];
    for(const [x,y,sz] of arr)ctx.fillRect(x,y,sz,sz);
  }
}

setInterval(()=>{drawFrame(frames[fi]);fi=(fi+1)%frames.length;},40);

// 控制台彩蛋：ASCII 心形（原版 stdout 输出）
console.log('%c'+(function(){
  let out='';
    for(let yj=-15;yj<=16;yj++){
      let row='';
      for(let xi=-16;xi<=17;xi++){
      let st=xi<0? -Math.pow(-xi/16,1/3):Math.pow(xi/16,1/3);
      st=Math.min(Math.max(st,-1),1);
      const t=Math.asin(st);
      let y1=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      let y2=y1;
      if(st!==1&&st!==-1){
        const sym=st>0?Math.PI/2:-Math.PI/2;
        const t2=2*sym-t;
        y2=-(13*Math.cos(t2)-5*Math.cos(2*t2)-2*Math.cos(3*t2)-Math.cos(4*t2));
      }
      row+=(yj>=Math.min(y1,y2)&&yj<=Math.max(y1,y2))?'*':' ';
    }
    if(row.includes('*'))out+=row+'\n';
  }
  return out;
})(),'color:#FF75AD');
</script>
</body>
</html>
